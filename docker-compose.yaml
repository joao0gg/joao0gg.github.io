services:
  blog:
    image: ruby:3.2
    working_dir: /site
    user: "1000:1000"
    environment:
      HOME: /tmp
      BUNDLE_PATH: /site/vendor/bundle
      JEKYLL_ENV: docker
    volumes: [".:/site"]
    ports: ["4000:4000"]
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --config _config.yml,_config_dev.yml"
