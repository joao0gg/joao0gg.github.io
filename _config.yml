# Site
locale                   : "en-US"
site_theme               : "default"
title                    : "João Gabriel Abrahão Franco"
title_separator          : "-"
name                     : &name "João Gabriel Abrahão Franco"
description              : &description "Personal website"
url                      : https://joao0gg.github.io
baseurl                  : ""
repository               : "joao0gg/joao0gg.github.io"

# Sidebar (author profile)
author:
  avatar           : "joao0gg.jpeg"
  name             : ""
  bio              : ""
  location         : "Ribeirão Preto, São Paulo, Brazil"
  employer         : "Universidade de Ribeirão Preto"
  email            : "joao.gfranco@sou.unaerp.edu.br"
  orcid            : "https://orcid.org/0009-0003-2797-9087"
  lattes           : "https://lattes.cnpq.br/4596345916105617"
  github           : "joao0gg"
  instagram        : "joao0gg"
  linkedin         : "joão-gabriel-abrahão-franco-443483269"

# Site settings
teaser                   : "joao0gg.jpeg"
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
atom_feed:
  hide                   : false

# SEO and social sharing
og_image                 : "/images/joao0gg.jpeg"
og_description           : *description
social:
  type                   : Person
  name                   : *name
  links:
    - "https://github.com/joao0gg"
    - "https://orcid.org/0009-0003-2797-9087"
    - "https://www.linkedin.com/in/jo%C3%A3o-gabriel-abrah%C3%A3o-franco-443483269/"
    - "https://instagram.com/joao0.gg"

analytics:
  provider               : "false"

# Reading files
include:
  - _pages
  - files
exclude:
  - .devcontainer
  - .vscode
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docker-compose.yaml
  - _config_dev.yml
  - vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true
      share: true

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
